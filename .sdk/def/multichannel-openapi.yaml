  /messages/{messageId}/events:
    get:
      tags:
        - Messages
      operationId: getMessageEvents
      summary: Get events related to a message
      description: |-
        Returns up to 100 latest `messageStatusChanged` and `userMessageReceived` events
        related to a specific message. Pagination is available for up to 500 events.

        `templateReviewStatusChanged` events are **not** available through this operation;
        use callbacks or traffic files instead.

        This operation shares API throttling quotas with `POST /messages`. Recommended for
        testing and low-traffic use cases only.

        ### Filtering

        Any JSON-path property of the returned objects can be used as a query parameter
        to filter results. The value supports the following operators:

        | Operator | Syntax | Description |
        |----------|--------|-------------|
        | <code style="white-space:nowrap">eq</code> | `property=eq:val1,val2` | Case-insensitive equality against any of the values (default if operator omitted) |
        | <code style="white-space:nowrap">in</code> | `property=in:val1,val2` | Synonym for `eq` |
        | <code style="white-space:nowrap">contains</code> | `property=contains:text` | Property value contains the text (case-insensitive) |
        | <code style="white-space:nowrap">matches</code> | `property=matches:regex` | Case-insensitive ECMAScript regex match |
        | <code style="white-space:nowrap">between</code> | `property=between:start,end` | Inclusive range for dates/numbers; either boundary can be omitted |
        | <code style="white-space:nowrap">exists</code> | `property=exists:true\|false` | Tests whether a property exists |

        **Negation:** prefix any operator (except `exists`) with `!` to negate.
        E.g. `meta.status=!in:APPROVED` returns entries not having that value, or not having that property.

        **Nested paths** use dot-notation: `reviews.whatsapp.status=APPROVED`

        **Bracket notation** for keys containing dots: `meta['mtd.designerId']=exists:true`

        Multiple filter parameters are combined with logical AND.

        ### Sorting

        The `_sort` parameter accepts comma-separated property paths with optional `asc:` / `desc:` prefix.
        Use `!` for null-coalescing: `_sort=desc:updatedOn!createdOn` sorts by `updatedOn`,
        falling back to `createdOn` when undefined.

        See response examples for complete query strings with filtering, sorting and pagination.
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageIndex'
        - name: _sort
          in: query
          required: false
          description: 'Sort by property paths with optional asc:/desc: prefix'
          schema:
            type: string
          examples:
            newest_first:
              summary: Newest events first
              value: desc:on
      responses:
        '200':
          description: Events found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEventsResponse'
              examples:
                delivery_outcomes:
                  summary: GET /messages/{messageId}/events?messageStatusChanged.status=in:DELIVERED,DELIVERY_FAILED&_sort=desc:on
                  value:
                    _totalItemCount: 4
                    _pageSize: 100
                    _pageCount: 1
                    events:
                      - eventId: emsc5744b2da290d4132
                        'on': '2024-11-04T15:38:26.182Z'
                        accountId: customer-account-id
                        messageStatusChanged:
                          messageId: msg1uO2aI1Uwz5RHliBXLlZjM
                          requestId: req600CkeP7HOeMNxmJj6b9Ut
                          channelId: sms
                          userId: '33699999999'
                          status: DELIVERED
                          channelData:
                            sms.segmentCount: '2'
                            sms.originatingAddress: MYBRAND
                sms_errors_only:
                  summary: GET /messages/{messageId}/events?messageStatusChanged.channelId=sms&messageStatusChanged.error.code=exists:true
                  value:
                    _totalItemCount: 1
                    _pageSize: 100
                    _pageCount: 1
                    events:
                      - eventId: ems2mtzoOqeYkKAjLbvz3yQ1R
                        'on': '2024-11-04T17:12:03.737Z'
                        accountId: customer-account-id
                        messageStatusChanged:
                          messageId: msg1XAXgWzR3X27wjMdxrlJyr
                          requestId: req4fm8jz3GWtERlrWDw1s0xD
                          channelId: sms
                          userId: '33699999999'
                          status: DELIVERY_FAILED
                          error:
                            code: CHANNEL_REJECTED
                            channelError: Invalid destination address
                optout_events:
                  summary: GET /messages/{messageId}/events?userMessageReceived.content.optout=exists:true
                  value:
                    _totalItemCount: 1
                    _pageSize: 100
                    _pageCount: 1
                    events:
                      - eventId: eum3eFfSK3Zoq2gVvcgP7HVvt
                        'on': '2024-11-04T11:12:28.665Z'
                        accountId: customer-account-id
                        userMessageReceived:
                          channelId: sms
                          userId: '33699999999'
                          content:
                            optout:
                              text: STOP
                          replyToMessageId: msg1uO2aI1Uwz5RHliBXLlZjM
                reply_button_clicks:
                  summary: GET /messages/{messageId}/events?userMessageReceived.content.postback.buttonType=in:reply,openUrl
                  value:
                    _totalItemCount: 2
                    _pageSize: 100
                    _pageCount: 1
                    events:
                      - eventId: eumAg77ExuCtUyGB0m4VVYZc0
                        'on': '2024-11-04T11:20:58.527Z'
                        accountId: customer-account-id
                        userMessageReceived:
                          channelId: rcs
