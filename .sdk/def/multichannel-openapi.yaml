components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: x-api-key
      in: header
      description: API key for /v1 endpoints
    oauth2:
      type: oauth2
      description: OAuth2 client credentials for /v2 endpoints
      flows:
        clientCredentials:
          tokenUrl: https://sso.linkmobility.com/auth/realms/CPaaS/protocol/openid-connect/token
          scopes: {}
  parameters:
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
      description: Unique message identifier
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
      description: Unique template identifier
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        enum:
        - sms
        - rcs
        - viber
        - whatsapp
        - mock
      description: Channel identifier
    PageSize:
      name: _pageSize
      in: query
      required: false
      schema:
        type: integer
      description: Page size for pagination
    PageIndex:
      name: _pageIndex
      in: query
      required: false
      schema:
        type: integer
      description: Zero-based page index
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authorization failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Locked:
      description: Template is locked for editing (active review with SUBMITTING, SUBMITTED or APPROVED status)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error details
    Context:
      type: object
      description: Free-form client-specific correlation values (max 50 entries, keys 1-50 chars, values max 500 chars)
      maxProperties: 50
      additionalProperties:
        type: string
      examples:
      - myCampaignId: christmas-560650
        myUserId: vincent@example.com
    StringStringMap:
      type: object
      additionalProperties:
        type: string
      examples:
      - sms.originatingAddress: MYBRAND
        rcs.card.orientation: HORIZONTAL
    SendMessagesRequest:
      type: object
      required:
      - messages
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Message'
      examples:
      - messages:
        - channelId: sms
          userId: '33699999999'
          content:
            text: This is a simple text sent by SMS!
    Message:
      type: object
      required:
      - channelId
      - userId
      - content
      description: Message definition container
      properties:
        channelId:
          type: string
          description: 'Supported channel identifier: sms, rcs, viber, whatsapp, mock'
          enum:
          - sms
          - rcs
          - viber
          - whatsapp
          - mock
        userId:
          type: string
          description: Channel-native user identifier (e.g. phone number)
        content:
          $ref: '#/components/schemas/Content'
        context:
          $ref: '#/components/schemas/Context'
        validUntil:
          type: string
          format: date-time
          description: Absolute message expiration (ISO 8601). Cannot be combined with validFor.
        validFor:
          type: string
          description: Relative message expiration (ISO 8601 duration, e.g. PT8H). Cannot be combined with validUntil.
        scheduleAt:
          type: string
          format: date-time
          description: Message sending time or start of spreading (ISO 8601). Requires scheduling feature.
        allowedHours:
          type: string
          description: Allowed messaging hours (OpenStreetMap Opening Hours format). Required when whenDnd is specified.
        whenDnd:
          type: string
          enum:
          - ignore
          - defer
          - reject
          description: Behavior during disallowed hours (DND). defer requires scheduling feature.
        spreadOver:
          type: string
          description: Random scheduling period (ISO 8601 duration, e.g. P7D). Requires scheduling feature.
        timeZone:
          type: string
          description: IANA time zone for scheduleAt, allowedHours and validUntil (e.g. Europe/Zurich)
        campaignId:
          type: string
          description: Schedule grouping identifier for bulk counting/deletion
        options:
          $ref: '#/components/schemas/StringStringMap'
        fallback:
          $ref: '#/components/schemas/Message'
      examples:
      - channelId: rcs
        userId: '33699999999'
        content:
          text: Hello, this is a simple text...
          suggestions:
          - caption: Yes!
            postback: 'YES'
          - caption: No!
            postback: 'NO'
        context:
          myCampaignId: christmas-560650
          myUserId: vincent@example.com
    Content:
      description: 'Message content. Exactly one of the content type properties must be provided:

        text, media, location, card, carousel, or fromTemplate.

        Suggestions (quick replies) can be added to primitive content types.

        '
      type: object
      properties:
        text:
          type: string
          description: Simple text content
        media:
          $ref: '#/components/schemas/Media'
        location:
          $ref: '#/components/schemas/Location'
        card:
          $ref: '#/components/schemas/Card'
        carousel:
          $ref: '#/components/schemas/Carousel'
        fromTemplate:
          $ref: '#/components/schemas/FromTemplate'
        suggestions:
          type: array
          description: Quick replies / suggestion buttons (not applicable to fromTemplate)
          items:
            $ref: '#/components/schemas/Button'
      examples:
      - card:
          title: Private sale
          text: Enjoy your personal -30% rebate on all items
          media:
            source: https://example.com/picture.jpeg
            type: image/png
          buttons:
          - caption: Get me there
            openUrl:
              url: https://to.page/e9ZxkeAvu
    Media:
      type: object
      required:
      - type
      - source
      properties:
        type:
          type: string
          description: MIME type (e.g. image/gif, video/mp4)
        source:
          type: string
          description: Media resource URI
        thumbnail:
          type: string
          description: Thumbnail image URI
        description:
          type: string
          description: Caption / media description
      examples:
      - type: image/jpeg
        source: https://example.com/picture.jpeg
        thumbnail: https://example.com/thumbnail.jpg
        description: An awesome picture!
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          description: Latitude in degrees (plus/minus 90)
        longitude:
          type: number
          format: double
          description: Longitude in degrees (plus/minus 180)
        title:
          type: string
          description: Short name of the location
        description:
          type: string
          description: Accompanying text description
      examples:
      - latitude: 48.86015347854819
        longitude: 2.326568685144047
        title: Musee d'Orsay
        description: Art museum - 1 Rue de la Legion d'Honneur, 75007 Paris
    Card:
      type: object
      description: Rich card containing media, text and/or buttons
      properties:
        media:
          $ref: '#/components/schemas/Media'
        location:
          $ref: '#/components/schemas/Location'
        title:
          type: string
        subtitle:
          type: string
        text:
          type: string
        buttons:
          type: array
          items:
            $ref: '#/components/schemas/Button'
      examples:
      - title: Still Life with Teapot and Fruit (1896)
        text: Still Life with Teapot...
        media:
          source: https://example.com/picture.jpeg
          type: image/jpeg
        buttons:
        - caption: Tell me more
          postback: DETAILS
        - caption: Call us
          postback: CALL
          dial:
            phoneNumber: '+33600000000'
        - caption: Visit us
          postback: WEB
          openUrl:
            url: https://www.example.com
    Carousel:
      type: object
      required:
      - cards
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
      examples:
      - cards:
        - title: Gustave Boyer in a Straw Hat
          text: Early twentieth-century scholars....
          media:
            source: https://example.com/picture1.jpeg
            type: image/jpeg
          buttons:
          - caption: View online
            openUrl:
              url: https://example.com
        - title: Seated Peasant
          text: The mood and palette...
          media:
            source: https://example.com/picture2.jpeg
            type: image/jpeg
          buttons:
          - caption: View online
            openUrl:
              url: https://example.com
    FromTemplate:
      type: object
      required:
      - templateId
      description: Content generated from a pre-defined template
      properties:
        templateId:
          type: string
          description: Template identifier
        variables:
          type: object
          additionalProperties:
            type: string
          description: Variable name-value pairs to inject into template placeholders
      examples:
      - templateId: tple93fe290002...
        variables:
