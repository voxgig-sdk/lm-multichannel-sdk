    Event:
      type: object
      required:
        - eventId
        - 'on'
        - accountId
      description: |
        Common event envelope. Exactly one of messageStatusChanged, userMessageReceived,
        or templateReviewStatusChanged will be present.
      properties:
        eventId:
          type: string
          description: Unique event identifier (for idempotent processing / deduplication)
        'on':
          type: string
          format: date-time
          description: UTC date-time when the event occurred
        accountId:
          type: string
          description: Account identifier
        messageStatusChanged:
          $ref: '#/components/schemas/MessageStatusChangedEvent'
        userMessageReceived:
          $ref: '#/components/schemas/UserMessageReceivedEvent'
        templateReviewStatusChanged:
          $ref: '#/components/schemas/TemplateReviewStatusChangedEvent'
      examples:
        - eventId: emsc5744b2da290d4132
          'on': '2018-12-23T18:25:43.511Z'
          accountId: vincent-inc
          messageStatusChanged:
            messageId: mfc5c734f85e650
            requestId: r4505e54055e450
            channelId: sms
            channelOperatorId: '20801'
            userId: '33607285022'
            status: DELIVERED
            channelStatus: '1'
            context:
              myWhateverId: aef5040
    MessageStatusChangedEvent:
