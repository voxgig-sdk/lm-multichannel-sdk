                summary: 'WhatsApp: card with a Flow button (LMCL provider). The flow must exist and be published in the Meta Business Portal. The button must be of flow type. Definition keys: whatsapp.button.flow.id (required), .action (navigate|data_exchange), .screen (entry screen, sent as navigate_screen). The caption becomes the CTA text and cannot contain variables. Optionally set .token here to pass a flow token when sending - it may hold a variable resolved per message. The session-only keys .data, .messageVersion and .mode are rejected on templates. Max 1 flow button per template; UTILITY and MARKETING categories only.'
                value:
