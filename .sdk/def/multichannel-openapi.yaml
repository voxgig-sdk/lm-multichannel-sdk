  - name: Context examples
    x-traitTag: true
    description: |
      `context` is a free-form set of key/value pairs, defined by the sending system and attached
      to a message. MyLINK Multichannel API does not interpret it and simply echoes it back,
      synchronously in the send response and asynchronously on every event related to that message.

      <div class="ocm-warning" style="margin:0 0 14px;padding:10px 14px;border-left:4px solid #d4a72c;border-radius:6px;background:#fff8c5;color:#24292f">⚠️ <strong>Context is retained for 30 days after a message is sent. Events arriving more than 30 days after the send carry no context.</strong></div>

      See also [Fallback examples](#tag/Fallback-examples) — a fallback message inherits the context
      of its primary message.

      ## Synchronous usage

      Context correlates messages submitted through one API request (batching) with the message IDs
      returned synchronously. This matters because the response order is not guaranteed to match the
      request order.

      A batch request containing two messages, each with its own context:

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "rcs",
            "userId": "33777777777",
            "content": {
              "text": "Test"
            },
            "context": {
              "myMessageId": "1"
            }
          },
          {
            "channelId": "rcs",
            "userId": "33777777777",
            "content": {
              "text": "Test"
            },
            "context": {
              "myMessageId": "2"
            }
          }
        ]
      }
      ```

      The API replies with message IDs and their corresponding contexts:

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "requestId": "req600CkeP7HOeMNxmJj6b9Ut",
        "messages": [
          {
            "messageId": "msg2gOW2ygyte9KtfIrR5EKnc",
            "context": {
              "myMessageId": "2"
            }
          },
          {
            "messageId": "msg1uO2aI1Uwz5RHliBXLlZjM",
            "context": {
              "myMessageId": "1"
            }
          }
        ]
      }
      ```

      ## Asynchronous usage

      Context is also echoed on every event related to the message.

      <div class="ocm-space"><br></div>

      ### Context on Message Status Changed events

      A message is sent with a context:

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "sms",
            "userId": "33777777777",
            "content": {
              "text": "Test"
            },
            "context": {
              "myUserId": "georges@example.com",
              "myCampaignId": "promo2020"
            }
          }
        ]
      }
      ```

      All *Message Status Changed* events carry the provided context:

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting event</strong></p>

      ```json
      {
        "events": [
          {
            "eventId": "ems74NDD5xftsgnpddyipbFmv",
            "on": "2020-03-06T16:38:25.0901689Z",
            "accountId": "ocm-demo",
            "messageStatusChanged": {
              "messageId": "msg1uO2aI1Uwz5RHliBXLlZjM",
              "requestId": "req600CkeP7HOeMNxmJj6b9Ut",
              "channelId": "sms",
              "userId": "33777777777",
              "status": "SENT",
              "context": {
                "myUserId": "georges@example.com",
                "myCampaignId": "promo2020"
              }
            }
          },
          {
            "eventId": "emsc5744b2da290d41zeAq",
            "on": "2020-03-06T16:38:26.1823910Z",
            "accountId": "ocm-demo",
            "messageStatusChanged": {
              "messageId": "msg1uO2aI1Uwz5RHliBXLlZjM",
              "requestId": "req600CkeP7HOeMNxmJj6b9Ut",
              "channelId": "sms",
              "userId": "33777777777",
              "status": "DELIVERED",
              "context": {
                "myUserId": "georges@example.com",
                "myCampaignId": "promo2020"
              }
            }
          }
        ]
      }
      ```

      <div class="ocm-space"><br></div>

      ### Context on a user reply

      The context of the original message is echoed on the *User Message Received* event too:

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting event</strong></p>

      ```json
      {
        "eventId": "eum4eFfSH3Zqo2gVvcgP6HVvs",
        "on": "2020-03-06T16:46:49.6397399Z",
        "accountId": "ocm-demo",
        "userMessageReceived": {
          "channelId": "sms",
          "userId": "33777777777",
          "content": {
            "text": "Hello?"
          },
          "replyToMessageId": "msg1uO2aI1Uwz5RHliBXLlZjM",
          "context": {
            "myUserId": "georges@example.com",
            "myCampaignId": "promo2020"
          }
        }
      }
      ```

      <div class="ocm-space"><br></div>

      ### Context inherited by a fallback message

      A request with a primary and a fallback message, with the context set on the primary message
      only. The primary fails; the fallback is sent and delivered, inheriting the context:

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "viber",
            "userId": "33777777777",
            "content": {
              "text": "Test on Viber"
            },
            "context": {
              "myUserId": "georges@example.com",
              "myCampaignId": "promo2020"
            },
            "fallback": {
              "channelId": "sms",
              "userId": "33777777777",
              "content": {
                "text": "Test on SMS"
              }
            }
          }
        ]
      }
      ```

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting event</strong></p>

      ```json
      {
        "events": [
          {
            "eventId": "ems1SSWf4DSx3qB4SjugGnjiY",
            "on": "2020-03-06T16:43:35.3156555Z",
            "accountId": "ocm-demo",
            "messageStatusChanged": {
              "messageId": "msg2gOW2ygyte9KtfIrR5EKnc",
              "requestId": "req600CkeP7HOeMNxmJj6b9Ut",
              "channelId": "viber",
              "userId": "33777777777",
              "status": "DELIVERY_FAILED",
              "error": {
                "code": "USER_UKNOWN",
                "channelError": "SRVC_NOT_VIBER_USER"
              },
              "context": {
                "myUserId": "georges@example.com",
                "myCampaignId": "promo2020"
              }
            }
          },
          {
            "eventId": "ems74NDD5xftsgnpddyipbFmv",
            "on": "2020-03-06T16:38:25.0901689Z",
            "accountId": "ocm-demo",
            "messageStatusChanged": {
              "messageId": "msg1uO2aI1Uwz5RHliBXLlZjM",
              "requestId": "req600CkeP7HOeMNxmJj6b9Ut",
              "channelId": "sms",
              "userId": "33777777777",
