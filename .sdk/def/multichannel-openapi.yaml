paths:
  /messages:
    post:
      tags:
        - Messages
      operationId: sendMessages
      summary: Send one or multiple messages
      description: |
        Sends 1 to 10 messages to specified users on specified channels.
        Total request payload must not exceed 6 MB. Individual message size must not exceed 250 KB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessagesRequest'
            examples:
              sms_text:
                summary: 'SMS: simple text'
                value:
                  messages:
                    - channelId: sms
                      userId: '33699999999'
                      content:
                        text: This is a simple text sent by SMS!
              sms_text_oadc:
                summary: 'SMS: text with custom originating address'
                value:
                  messages:
                    - channelId: sms
                      userId: '33699999999'
                      content:
                        text: This is a simple text sent by SMS!
                      options:
                        sms.originatingAddress: OCM
              rcs_text:
                summary: 'RCS: simple text'
                value:
                  messages:
                    - channelId: rcs
                      userId: '33699999999'
                      content:
                        text: This is a simple text sent by RCS!
