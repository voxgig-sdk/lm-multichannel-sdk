                    events:
                      - eventId: ems7GmGxURd2rQ8BFIEAhiL09
                        'on': '2024-11-04T15:12:03.195Z'
                        accountId: customer-account-id
                        messageStatusChanged:
                          messageId: msg1uO2aI1Uwz5RHliBXLlZjM
                          requestId: req17nxsvc0w9IwrBIirL5wCq
                          channelId: rcs
                          userId: '33699999999'
                          status: SENT
                      - eventId: ems7GmGxURd2rQ8BFIEAhiL10
                        'on': '2024-11-04T15:12:04.231Z'
                        accountId: customer-account-id
                        messageStatusChanged:
                          messageId: msg1uO2aI1Uwz5RHliBXLlZjM
                          requestId: req17nxsvc0w9IwrBIirL5wCq
                          channelId: rcs
                          userId: '33699999999'
                          status: DELIVERED
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
