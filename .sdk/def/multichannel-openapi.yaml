    description: |
      Request and event examples for the **Mock** channel. For the supported scenarios, cheat codes,
      content types and events, see [Mock specificities](#tag/Mock-specificities).

      ## Messages

      ### Text content

      With no `mock.scenario` option and no cheat code, a random scenario is played.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "mock",
            "userId": "33670707070",
            "content": {
              "text": "This is a simple text sent by Mock!"
            }
          }
        ]
      }
      ```

      <div class="ocm-space"><br></div>

      ### Text content with a cheat code and a Web Experience URL

      The `frenzy frenzy frenzy` cheat code selects the `SuccessAndRandomInteraction` scenario, which
      also opens and interacts with the linked Web Experience page.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "mock",
            "userId": "33678901234",
            "content": {
              "text": "Let's get frenzy frenzy frenzy! Click here: https://to.page/xxxxxx"
            }
          }
        ]
      }
      ```

      <div class="ocm-space"><br></div>

      ### Card content with Reply, Dial and Open URL buttons

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "mock",
            "userId": "33612345678",
            "content": {
              "card": {
                "title": "Still Life with Teapot and Fruit (1896)",
                "text": "Still Life with Teapot (French: Nature ...",
                "media": {
                  "source": "https://example.com/picture.jpeg",
                  "type": "image/jpeg"
                },
                "buttons": [
                  {
                    "caption": "More",
                    "reply": { "text": "More details" },
                    "postback": "DETAILS"
                  },
                  {
                    "caption": "Call us",
                    "dial": { "phoneNumber": "+33600000000" }
                  },
                  {
                    "caption": "Visit us",
                    "openUrl": { "url": "https://www.example.com" }
                  }
                ]
              }
            },
            "options": {
              "mock.scenario": "SuccessAndRandomInteraction"
            }
          }
        ]
      }
      ```

