  /traffic/files:
    get:
      tags:
      - Traffic
      operationId: listTrafficFilesRoot
      summary: List all traffic files
      description: 'Recursively lists all traffic files from the root. Returns max 1000 entries (oldest first).

        Files contain JSONL events (same semantics as callback events) and are available for 30 days.

        File URLs contain a security token expiring after 15 minutes.


        To list files under a specific folder, append the folder path to the URL,

        e.g. GET /traffic/files/events/2024/11/10/09


        To delete a file, use DELETE with the full file path,

        e.g. DELETE /traffic/files/events/2024/11/04/15/xxx.zip

        '
      responses:
        '200':
          description: Files listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficFilesResponse'
  /traffic/files/{path}:
    get:
      tags:
      - Traffic
      operationId: listTrafficFilesInFolder
      summary: List traffic files under a folder path
      description: 'Lists files recursively under a specified folder path. Returns max 1000 entries (oldest first).

        Path format: events/{year}/{month}/{day}/{hour}

        '
      parameters:
      - name: path
        in: path
        required: true
        description: Relative folder path (e.g. events/2024 or events/2024/11/10/09) or file path for DELETE
        schema:
          type: string
      responses:
        '200':
          description: Files listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficFilesResponse'
    delete:
      tags:
      - Traffic
      operationId: deleteTrafficFile
      summary: Delete a traffic file
      description: Deletes a specific traffic file by its relative path.
      parameters:
      - name: path
        in: path
        required: true
        description: Relative file path (e.g. events/2024/11/04/15/sequence.zip)
        schema:
          type: string
      responses:
        '204':
          description: File deleted
