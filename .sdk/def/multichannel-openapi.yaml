openapi: 3.1.0
info:
  title: MyLINK Multichannel API
  description: 'Public API for MyLINK Multichannel Messaging API platform.

    Supports sending messages across SMS, RCS, Viber, WhatsApp and other channels,

    managing message templates, downloading traffic files, and configuring account settings.


    ## Authentication


    Two authentication methods are available depending on the endpoint root:

    - **API Key** (`/v1`): Pass your API key in the `x-api-key` HTTP header.

    - **OAuth2** (`/v2`): Obtain a JWT token from the CPaaS SSO token endpoint https://sso.linkmobility.com/auth/realms/CPaaS/protocol/openid-connect/token and pass it as a Bearer token (clientCredentials flow type)      


    ## Receiving events


    OCM produces events throughout the lifecycle of messages (`messageStatusChanged`),

    when end-users interact (`userMessageReceived`), and when template reviews change

    (`templateReviewStatusChanged`). Three methods are available to consume these events:


    | Method | Endpoint | Delivery | Event types | Pros | Cons |

    |--------|----------|----------|-------------|------|------|

    | **Callbacks** (webhooks) | Configured via `PATCH /self/settings` | Real-time push (HTTP POST) | All three | Lowest latency, no polling needed | Requires a publicly reachable HTTPS endpoint; must handle
    retries and idempotency |

    | **Get Message Events** | `GET /messages/{messageId}/events` | On-demand pull per message | `messageStatusChanged`, `userMessageReceived` only | Simple integration, no receiving endpoint needed | Shares
    rate limits with `POST /messages` (sending); not suited for high-traffic or bulk retrieval; no `templateReviewStatusChanged` |

    | **Traffic Files** | `GET /traffic/files` | Bulk pull (JSONL archives, 1 to ~15 min delay) | All three | Bulk retrieval of all events; no rate-limit impact on messaging; 30-day retention | Not real-time;
    requires downloading and parsing ZIP/JSONL files |'
  version: 5.0.0
  contact:
    email: product@linkmobility.com
servers:
- url: https://api.linkmobility.com/v1
  description: Production (API Key auth)
- url: https://api.linkmobility.com/v2
  description: Production (OAuth2 auth)
security:
- apiKey: []
- oauth2: []
tags:
- name: Messages
  description: Send messages, get events, manage individual schedules
- name: Schedules
  description: Bulk schedule counting and deletion
- name: Templates
  description: Create, update, delete and list message templates and their reviews
- name: Traffic
  description: Download event traffic files
- name: Self Admin
  description: Get and update account settings (callback configuration)
paths:
  /messages:
    post:
      tags:
      - Messages
      operationId: sendMessages
      summary: Send one or multiple messages
      description: 'Sends 1 to 10 messages to specified users on specified channels.

        Total request payload must not exceed 6 MB. Individual message size must not exceed 250 KB.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessagesRequest'
            examples:
              sms_text:
                summary: 'SMS: simple text'
                value:
                  messages:
                  - channelId: sms
                    userId: '33699999999'
                    content:
                      text: This is a simple text sent by SMS!
              sms_text_oadc:
                summary: 'SMS: text with custom originating address'
