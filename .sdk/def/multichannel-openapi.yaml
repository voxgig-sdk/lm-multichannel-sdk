        - messageId
        - requestId
        - status
      properties:
        channelId:
          type: string
        channelOperatorId:
          type: string
          description: Mobile operator ID (MNO) if applicable
        userId:
          type: string
        messageId:
          type: string
        requestId:
          type: string
        fallbackOrder:
          type: integer
