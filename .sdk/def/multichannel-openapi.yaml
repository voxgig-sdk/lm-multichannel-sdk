              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /templates/{templateId}/reviews/{channelId}/events:
    get:
      tags:
        - Templates
      operationId: getTemplateReviewEvents
      summary: Get events related to a channel-specific template review
      description: |-
        Returns up to 100 latest `templateReviewStatusChanged` events for a specific template's channel review (e.g. WhatsApp). Pagination is available for up to 500 events.
        Unlike `GET /messages/{messageId}/events`, this operation returns `templateReviewStatusChanged` events only. It shares API throttling quotas with `POST /messages`; recommended for testing and low-traffic use cases only.
        Filtering and sorting work as described for `GET /messages/{messageId}/events` (any JSON-path property of the returned objects as a query parameter, plus the `_sort` parameter).
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageIndex'
        - name: _sort
          in: query
          required: false
          description: 'Sort by property paths with optional asc:/desc: prefix'
          schema:
            type: string
          examples:
            newest_first:
              summary: Newest events first
              value: desc:on
      responses:
        '200':
          description: Events found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateReviewEventsResponse'
              examples:
                wa_review_history:
                  summary: GET /templates/{templateId}/reviews/whatsapp/events?_sort=desc:on
                  value:
                    _totalItemCount: 2
                    _pageSize: 100
                    _pageCount: 1
                    events:
                      - eventId: ets7YK43OsPw6h4JdoypoT7jJ
