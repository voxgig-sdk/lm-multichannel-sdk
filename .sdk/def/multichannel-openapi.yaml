    description: |
      Request and event examples for the **SMS** channel. For the supported options, content types
      and channel data, see [SMS specificities](#tag/SMS-specificities).

      ## Messages

      ### Text content

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "sms",
            "userId": "33699999999",
            "content": {
              "text": "This is a simple text sent by SMS!"
            }
          }
        ]
      }
      ```

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting message</strong></p>

      <img src="https://ocm.linkmobility.solutions/public/schemas/assets/images/channels/sms/text-simple.jpg" alt="Simple SMS text as received on the end-user device" width="50%" style="display:block;width:50%;height:auto;margin-bottom:14px;border:1px solid #d0d7de;border-radius:6px;box-shadow:0 1px 3px rgba(27,31,36,0.12)">

      <div class="ocm-space"><br></div>

      ### Text content with a custom originating address

      The `sms.originatingAddress` option overrides the originating address (OADC) configured on
      the account.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "sms",
            "userId": "33699999999",
            "content": {
              "text": "This is a simple text sent by SMS!"
            },
            "options": {
              "sms.originatingAddress": "OCM"
            }
          }
        ]
      }
      ```

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting message</strong></p>

      <img src="https://ocm.linkmobility.solutions/public/schemas/assets/images/channels/sms/text-oadc.jpg" alt="SMS with a custom originating address as received on the end-user device" width="50%" style="display:block;width:50%;height:auto;margin-bottom:14px;border:1px solid #d0d7de;border-radius:6px;box-shadow:0 1px 3px rgba(27,31,36,0.12)">

      ## Events

      ### Message sending fails because the user is not reachable through SMS

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting event</strong></p>

      ```json
      {
        "eventId": "ems2mtzoOqeYkKAjLbvz3yQ1R",
        "on": "2020-03-06T17:12:03.737806Z",
        "accountId": "customer-account-id",
        "messageStatusChanged": {
          "messageId": "msg1XAXgWzR3X27wjMdxrlJyr",
          "requestId": "req4fm8jz3GWtERlrWDw1s0xD",
          "channelId": "sms",
          "userId": "99999999",
          "status": "DELIVERY_FAILED",
          "error": {
            "code": "CHANNEL_REJECTED",
            "channelError": "Invalid destination address"
          }
        }
      }
      ```

      <div class="ocm-space"><br></div>

      ### Message is sent to the user

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting event</strong></p>

      ```json
      {
        "eventId": "ems74NDD5xftsgnpddyipbFmv",
        "on": "2020-03-06T16:38:25.0901689Z",
        "accountId": "customer-account-id",
        "messageStatusChanged": {
          "messageId": "msg1uO2aI1Uwz5RHliBXLlZjM",
          "requestId": "req600CkeP7HOeMNxmJj6b9Ut",
          "channelId": "sms",
          "userId": "33699999999",
          "status": "SENT",
          "channelData": {
            "sms.segmentCount": "4",
            "sms.originatingAddress": "MYBRAND"
          }
        }
      }
      ```

      <div class="ocm-space"><br></div>

      ### User receives the message

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting event</strong></p>

      ```json
      {
        "eventId": "ems74NDD5xftsgnpddyipbFmv",
        "on": "2020-03-06T16:38:26.1823910Z",
        "accountId": "customer-account-id",
        "messageStatusChanged": {
          "messageId": "msg1uO2aI1Uwz5RHliBXLlZjM",
          "requestId": "req600CkeP7HOeMNxmJj6b9Ut",
          "channelId": "sms",
          "userId": "33699999999",
          "status": "DELIVERED",
          "channelData": {
            "sms.segmentCount": "4",
            "sms.originatingAddress": "MYBRAND"
          }
        }
      }
      ```

      <div class="ocm-space"><br></div>

      ### User sends a reply

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>User action</strong></p>

      <img src="https://ocm.linkmobility.solutions/public/schemas/assets/images/channels/sms/user-reply.jpg" alt="End-user replying to an SMS on their device" width="50%" style="display:block;width:50%;height:auto;margin-bottom:14px;border:1px solid #d0d7de;border-radius:6px;box-shadow:0 1px 3px rgba(27,31,36,0.12)">

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting event</strong></p>

