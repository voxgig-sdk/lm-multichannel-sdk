  - name: Viber examples
    x-traitTag: true
    description: |
      Request and event examples for the **Viber** channel. For the supported options, content types
      and per-property limits, see [Viber specificities](#tag/Viber-specificities).

      ## Messages

      ### Text content

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "viber",
            "userId": "33699999999",
            "content": {
              "text": "This is a simple text sent by Viber!"
            }
          }
        ]
      }
      ```

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting message</strong></p>

      <img src="https://ocm.linkmobility.solutions/public/schemas/assets/images/channels/viber/text-simple.png" alt="Simple Viber text as received on the end-user device" width="50%" style="display:block;width:50%;height:auto;margin-bottom:14px;border:1px solid #d0d7de;border-radius:6px;box-shadow:0 1px 3px rgba(27,31,36,0.12)">

      <div class="ocm-space"><br></div>

      ### Text content sent to all devices

      The `viber.deviceDestination` option lets the message reach the user's tablets as well as their
      smartphone. The message renders identically to the example above.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "viber",
            "userId": "33699999999",
            "content": {
              "text": "This is a simple text sent by Viber!"
            },
            "options": {
              "viber.deviceDestination": "allDevices"
            }
          }
        ]
      }
      ```

      <div class="ocm-space"><br></div>

      ### Media content with a JPEG image

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "viber",
            "userId": "33699999999",
            "content": {
              "media": {
                "type": "image/jpeg",
                "source": "https://example.com/picture.jpeg"
              }
            }
          }
        ]
      }
      ```

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting message</strong></p>

      <img src="https://ocm.linkmobility.solutions/public/schemas/assets/images/channels/viber/media-image.png" alt="Viber media message as received on the end-user device" width="50%" style="display:block;width:50%;height:auto;margin-bottom:14px;border:1px solid #d0d7de;border-radius:6px;box-shadow:0 1px 3px rgba(27,31,36,0.12)">

      <div class="ocm-space"><br></div>

      ### Card content with an Open URL button

      Viber cards must carry exactly one button.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "viber",
            "userId": "33699999999",
            "content": {
              "card": {
                "text": "Chalet in Bernese Oberland, Switzerland",
                "media": {
                  "type": "image/jpeg",
                  "source": "https://www.example.com/picture.jpg"
                },
                "buttons": [
                  {
                    "caption": "Book the chalet",
                    "openUrl": {
                      "url": "https://www.example.com"
                    }
                  }
                ]
              }
            }
          }
