            whatsapp.template.category: MARKETING
    DeliveryError:
      type: object
      required:
        - code
      description: Error details for DELIVERY_FAILED, DELIVERY_RETRIED or SCHEDULE_DELETION_FAILED statuses. See the [Message Delivery Errors](#tag/Message-Delivery-Errors) addendum for the error code reference.
      properties:
        code:
          $ref: '#/components/schemas/DeliveryErrorCode'
        details:
          type: string
          description: Additional information about the error
        channelError:
          type: string
          description: Channel-native error code/message
      examples:
        - code: USER_UKNOWN
          channelError: '404'
          details: Requested entity was not found.
    MessageStatus:
      type: string
      description: Message lifecycle status. See the [Message statuses](#tag/Message-Statuses) addendum for the lifecycle diagram and the full status reference.
      enum:
        - SCHEDULE_QUEUED
        - SCHEDULED
        - SCHEDULE_DELETED
        - SCHEDULE_DELETION_FAILED
        - QUEUED
        - SENT
        - DELIVERED
        - READ
        - DELIVERY_RETRIED
        - DELIVERY_FAILED
      x-enum-descriptions:
        SCHEDULE_QUEUED: Message queued for scheduling. Triggered by scheduling, spreading, or DND deferral.
        SCHEDULED: Message was scheduled
        SCHEDULE_DELETED: Message schedule was deleted
        SCHEDULE_DELETION_FAILED: Message schedule deletion failed. See Message Delivery Errors for more details about the occurred failure.
        QUEUED: Message was created in the system and was queued for sending
        SENT: Message was sent to the channel. Delivery can still fail on the channel's end later, asynchronously.
        DELIVERED: Message was delivered to the end-user
        READ: Message was read by the end-user (available on certain channels only)
        DELIVERY_RETRIED: Message delivery failed and the system is trying to send it again. See Message Delivery Errors for more details about the occurred failure.
        DELIVERY_FAILED: 'Message delivery fatally failed: no retries are possible, the maximum number of retries was reached, or delivery failed downstream (on the channel''s end). See Message Delivery Errors for more details.'
    DeliveryErrorCode:
      type: string
      description: Message delivery error code, returned in `DeliveryError.code`. See the [Message delivery errors](#tag/Message-Delivery-Errors) addendum for the full list of codes.
      enum:
        - CLIENT_MESSAGE_INVALID
        - CLIENT_CONFIGURATION_INVALID
        - CLIENT_MESSAGE_EXPIRED
        - CLIENT_QUOTA_EXCEEDED
        - CLIENT_MESSAGE_FORBIDDEN
        - CHANNEL_REJECTED
        - CHANNEL_UNAVAILABLE
        - CHANNEL_INTERNAL_ISSUE
        - CHANNEL_OTHER_ISSUE
        - USER_UKNOWN
        - USER_BLOCKED
        - USER_UNAVAILABLE
        - INTERNAL_NOT_IMPLEMENTED
        - INTERNAL_OTHER_ISSUE
      x-enum-descriptions:
        CLIENT_MESSAGE_INVALID: Message content or other message parameters are invalid (occurred while attempting to send the message to the channel). See the details field for more information.
        CLIENT_CONFIGURATION_INVALID: Client's account settings are invalid (occurred while attempting to send the message to the channel). See the details field for more information.
        CLIENT_MESSAGE_EXPIRED: Message delivery was canceled (TTL reached)
        CLIENT_QUOTA_EXCEEDED: An account quota was exceeded (e.g. message schedule quota)
        CLIENT_MESSAGE_FORBIDDEN: Message is not allowed to be sent due to a platform restriction (e.g., messaging DND policy)
        CHANNEL_REJECTED: Channel rejected that operation. See the details field for more information.
        CHANNEL_UNAVAILABLE: Channel is busy (timeout, throttling, connection issues). See the details field for more information. Retry can be necessary.
        CHANNEL_INTERNAL_ISSUE: Channel experiences an internal issue. See the details field for more information. Retry can be necessary.
        CHANNEL_OTHER_ISSUE: An unspecified channel issue occurred. See the details field for more information.
        USER_UKNOWN: 'User is invalid or unknown (e.g. is not present on the channel). Note: UKNOWN (and not UNKNOWN) is a historical typo.'
        USER_BLOCKED: User is blocked (e.g. cannot be messaged to).
        USER_UNAVAILABLE: User is temporarily unavailable
        INTERNAL_NOT_IMPLEMENTED: The requested feature is not yet implemented.
        INTERNAL_OTHER_ISSUE: The service experiences internal issues. See the details field for more information. Retry can be necessary.
    TemplateReviewStatus:
      type: string
      description: Template review lifecycle status. See the [Template review statuses](#tag/Template-Review-Statuses) addendum for the review lifecycle diagram and the full status reference.
      enum:
        - SUBMITTING
        - SUBMITTED
        - APPROVED
        - REJECTED
        - SUSPENDED
        - DELETING
        - DELETED
      x-enum-descriptions:
        SUBMITTING: Template is about to be submitted (cannot be used yet)
        SUBMITTED: Template submitted for review or being re-evaluated (cannot be used yet)
        APPROVED: Template approved and usable with the channel
        REJECTED: Template rejected (can be modified and resubmitted)
        SUSPENDED: Template temporarily suspended by channel provider
        DELETING: Template is being deleted on channel side (cannot be used)
        DELETED: Template deleted on channel provider side (new review needed to recreate)
