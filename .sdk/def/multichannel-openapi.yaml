  - name: Schedule examples
    x-traitTag: true
    description: |
      Scheduling properties are set per message on `POST /v1/messages`, and can be combined.

      | Property | Purpose |
      | --- | --- |
      | <code style="white-space:nowrap">scheduleAt</code> | Send at a fixed date and time. |
      | <code style="white-space:nowrap">timeZone</code> | The IANA time zone that `scheduleAt` and `allowedHours` are interpreted in. |
      | <code style="white-space:nowrap">spreadOver</code> | Spread sending randomly across an ISO 8601 duration. |
      | <code style="white-space:nowrap">allowedHours</code> | Restrict sending to an opening-hours expression. |
      | <code style="white-space:nowrap">whenDnd</code> | What to do when the send falls in a do-not-disturb window (`defer`). |
      | <code style="white-space:nowrap">validFor</code> | Time to live: give up if the message cannot be delivered within this duration. |
      | <code style="white-space:nowrap">campaignId</code> | Group the resulting schedules so they can be counted or deleted together. |

      For the schedule management operations see [Schedules](#tag/Schedules).

      ## Schedule at a fixed date and time

      An SMS scheduled for 16 February 2026 at 08:00 Zurich time.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```http
      POST /v1/messages
      ```

      ```json
      {
        "messages": [
          {
            "channelId": "sms",
            "userId": "...",
            "content": "...",
            "scheduleAt": "2026-02-16 08:00",
            "timeZone": "Europe/Zurich"
          }
        ]
      }
      ```

      ## Spread sending over a period

      A WhatsApp message scheduled randomly within the next 4 hours.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "whatsapp",
            "userId": "...",
            "content": "...",
            "spreadOver": "PT4H"
          }
        ]
      }
      ```

      ## Spread sending within allowed hours

      An RCS message scheduled randomly within the next 30 days, Monday to Friday from 10:00 to
      20:00 Zurich time, excluding 3 and 6 April.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "rcs",
            "userId": "...",
            "content": "...",
            "spreadOver": "P30D",
            "allowedHours": "Mo-Fr 10:00-20:00; Apr 03 off; Apr 06 off",
            "timeZone": "Europe/Zurich"
          }
        ]
      }
      ```

      ## Do-not-disturb deferral on a fallback message

      An RCS message sent immediately, with an SMS fallback that defers to allowed hours and expires
      after three days.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "rcs",
            "userId": "...",
            "content": "...",
            "fallback": {
              "channelId": "sms",
              "userId": "...",
              "content": "...",
              "whenDnd": "defer",
              "allowedHours": "Mo-Fr 10:00-20:00",
              "timeZone": "Europe/Zurich",
              "validFor": "P3D"
            }
          }
        ]
      }
      ```

      ## Everything combined, grouped by campaign

      An RCS message scheduled randomly within seven days starting 16 February 2026 at 08:00 Zurich
      time, Monday to Friday from 10:00 to 20:00, with a two-hour time to live, its schedule
      belonging to the campaign *winter holidays 2026*; plus an SMS fallback with do-not-disturb
      deferral and a three-day time to live.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "channelId": "rcs",
            "userId": "...",
            "content": "...",
            "scheduleAt": "2026-02-16 08:00",
            "allowedHours": "Mo-Fr 10:00-20:00",
            "timeZone": "Europe/Zurich",
            "whenDnd": "defer",
            "spreadOver": "P7D",
            "validFor": "PT2H",
            "campaignId": "winter holidays 2026",
            "fallback": {
              "channelId": "sms",
              "userId": "...",
              "content": "...",
              "allowedHours": "Mo-Fr 10:00-20:00",
              "timeZone": "Europe/Zurich",
              "whenDnd": "defer",
              "validFor": "P3D"
            }
          }
        ]
      }
      ```
