      ### Card content with a document header (utility category)

      Both the document source and its type are variables, so the message can carry any supported
      document format.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
          "template": {
              "content": {
                  "card": {
                      "media": {
                          "source": "{{catalogueUrl}}",
                          "type": "{{documentType}}"
                      },
                      "text": "Hi {{firstName}}! You are subscribed to receive our catalogues.\nHere is our *{{title}}* catalogue.",
                      "subtitle": "Please reply STOP to unsubscribe"
                  }
              },
              "variables": [
                  {
                      "name": "firstName",
                      "examples": [
                          "Alice"
                      ]
                  },
                  {
                      "name": "title",
                      "examples": [
                          "Museum Selection 2023"
                      ]
                  },
                  {
                      "name": "catalogueUrl",
                      "examples": [
                          "https://www.example.com/selection2023.pdf"
                      ]
                  },
                  {
                      "name": "documentType",
                      "examples": [
                          "application/pdf"
                      ]
                  }
              ],
              "options": {
                  "whatsapp.template.category": "UTILITY"
              }
          }
      }
      ```

