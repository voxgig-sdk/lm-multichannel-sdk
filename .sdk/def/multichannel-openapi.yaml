        scheduledAt:
          type: string
          format: date-time
          description: Actual schedule time
        campaignId:
          type: string
        status:
          $ref: '#/components/schemas/MessageStatus'
        channelStatus:
          type: string
          description: Channel-native status code
        channelData:
          $ref: '#/components/schemas/StringStringMap'
        error:
          $ref: '#/components/schemas/DeliveryError'
        context:
          $ref: '#/components/schemas/Context'
      examples:
        - messageId: msg1uO2aI1Uwz5RHliBXLlZjM
          requestId: req600CkeP7HOeMNxmJj6b9Ut
