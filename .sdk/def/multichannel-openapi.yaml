                          content:
                            postback:
                              payload: LOVE
                              text: J'aime
                              buttonType: reply
                          replyToMessageId: msg1uO2aI1Uwz5RHliBXLlZjM
                      - eventId: eumAUO65Z6IQwIri03xJu3Yf0
                        'on': '2024-11-04T11:24:09.626Z'
                        accountId: customer-account-id
