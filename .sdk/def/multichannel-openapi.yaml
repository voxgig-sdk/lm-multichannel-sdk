  - name: WhatsApp examples
    x-traitTag: true
    description: |
      Template, request and event examples for the **WhatsApp** channel. For the template review
      flow, supported options, content types and channel data, see
      [WhatsApp specificities](#tag/WhatsApp-specificities).

      ## Templates

      ### Text content

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "template": {
          "content": {
            "text": "Hello, this is a simple text message."
          }
        }
      }
      ```

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting message</strong></p>

      <img src="https://ocm.linkmobility.solutions/public/schemas/assets/images/channels/whatsapp/tpl-text.png" alt="WhatsApp text template preview" width="50%" style="display:block;width:50%;height:auto;margin-bottom:14px;border:1px solid #d0d7de;border-radius:6px;box-shadow:0 1px 3px rgba(27,31,36,0.12)">

      <div class="ocm-space"><br></div>

      ### Text content with variables

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "template": {
          "content": {
            "text": "Hello {{firstName}} {{lastName}}, this is a text message."
          },
          "variables": [
            { "name": "firstName", "examples": [ "Ignatius" ] },
            { "name": "lastName", "examples": [ "Reilly" ] }
          ]
        }
      }
      ```

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting message</strong></p>

      <img src="https://ocm.linkmobility.solutions/public/schemas/assets/images/channels/whatsapp/tpl-text-variables.png" alt="WhatsApp text template with variables" width="50%" style="display:block;width:50%;height:auto;margin-bottom:14px;border:1px solid #d0d7de;border-radius:6px;box-shadow:0 1px 3px rgba(27,31,36,0.12)">

      <div class="ocm-space"><br></div>

      ### Card content with a title, text and subtitle

      The `subtitle` is rendered as the message footer.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "template": {
          "content": {
            "card": {
              "title": "Hi {{firstName}}!",
              "text": "{{firstName}}, how are you doing?",
              "subtitle": "Please reply below"
            }
          },
          "variables": [
            { "name": "firstName", "examples": [ "Ignatius" ] }
          ]
        }
      }
      ```

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting message</strong></p>

      <img src="https://ocm.linkmobility.solutions/public/schemas/assets/images/channels/whatsapp/tpl-card-title-text-subtitle.png" alt="WhatsApp card template with title, text and footer" width="50%" style="display:block;width:50%;height:auto;margin-bottom:14px;border:1px solid #d0d7de;border-radius:6px;box-shadow:0 1px 3px rgba(27,31,36,0.12)">

      <div class="ocm-space"><br></div>

      ### Card content with three Reply buttons

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "template": {
          "content": {
            "card": {
              "title": "🗲 Energy level 🗲",
              "text": "{{firstName}}, how is your energy level today?",
              "subtitle": "Please choose",
              "buttons": [
                { "caption": "Amazing!", "postback": "3" },
                { "caption": "Normal", "postback": "2" },
                { "caption": "Sleepy..", "postback": "1" }
              ]
            }
          },
          "variables": [
            { "name": "firstName", "examples": [ "Ignatius" ] }
          ]
        }
      }
      ```

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting message</strong></p>

      <img src="https://ocm.linkmobility.solutions/public/schemas/assets/images/channels/whatsapp/tpl-card-three-reply-buttons.png" alt="WhatsApp card template with three reply buttons" width="50%" style="display:block;width:50%;height:auto;margin-bottom:14px;border:1px solid #d0d7de;border-radius:6px;box-shadow:0 1px 3px rgba(27,31,36,0.12)">

      <div class="ocm-space"><br></div>

      ### Card content with an Open URL button and a Dial button

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "template": {
          "content": {
            "card": {
              "text": "{{firstName}}, long time no see!",
              "subtitle": "Let's get in touch again",
              "buttons": [
                {
                  "caption": "Check your message box",
                  "openUrl": { "url": "https://www.example.com/{{accountId}}" }
                },
                {
                  "caption": "Call us",
                  "dial": { "phoneNumber": "+33655555555" }
                }
              ]
            }
          },
          "variables": [
            { "name": "firstName", "examples": [ "Ignatius" ] },
            { "name": "accountId", "examples": [ "ignatius42" ] }
          ]
        }
      }
      ```

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting message</strong></p>

      <img src="https://ocm.linkmobility.solutions/public/schemas/assets/images/channels/whatsapp/tpl-card-openurl-dial-buttons.png" alt="WhatsApp card template with open URL and dial buttons" width="50%" style="display:block;width:50%;height:auto;margin-bottom:14px;border:1px solid #d0d7de;border-radius:6px;box-shadow:0 1px 3px rgba(27,31,36,0.12)">

      <div class="ocm-space"><br></div>

      ### Card content with an image header and Markdown text

      The image header is based on a variable, so each message can carry its own picture.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "template": {
          "content": {
            "card": {
              "media": {
                "source": "{{paintingUrl}}",
                "type": "image/jpeg"
              },
              "text": "New painting available at the museum: *{{title}}* _({{year}})_, by *{{author}}*. Enjoy your visit!",
              "buttons": [
                {
                  "caption": "View",
                  "openUrl": { "url": "https://www.example.com/{{paintingId}}" }
                }
              ]
            }
          },
          "variables": [
            { "name": "title", "examples": [ "Montagnes à Tahiti" ] },
            { "name": "year", "examples": [ "1891" ] },
            { "name": "author", "examples": [ "Paul Gauguin" ] },
            { "name": "paintingUrl", "examples": [ "https://www.example.com/tahiti.jpg" ] },
            { "name": "paintingId", "examples": [ "120100" ] }
          ]
        }
      }
      ```

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting message</strong></p>

