              type: httpBasic
              login: someuser
              password: secret-ref:acme_...
    CallbackSettings:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: HTTPS callback endpoint URL
        auth:
          $ref: '#/components/schemas/CallbackAuth'
        tls:
          $ref: '#/components/schemas/CallbackTls'
        enableCompression:
          type: boolean
          description: Enable GZIP compression for callback requests (default false)
        signatureEnabled:
          type: boolean
          description: When true, MyLINK Multichannel API signs each outbound callback request with its platform Ed25519 key, adding the headers `X-OCM-Timestamp`, `X-OCM-Signature` (standard base64 of the raw signature) and `X-OCM-Key-Id`. The signature covers the UTF-8 bytes of `{X-OCM-Timestamp}.{body}`, where `body` is the uncompressed JSON callback body (signed before any GZIP compression). Verify it against the public JWKS at `/.well-known/ocm-cb/jwks.json`, selecting the key whose `kid` matches `X-OCM-Key-Id`. Default false.
      examples:
        - url: https://acme.com/ocm
          auth:
            type: customHttpHeader
            headerName: x-api-key
            password: secret
          enableCompression: true
          signatureEnabled: true
    CallbackAuth:
      type: object
      required:
        - type
        - password
      properties:
        type:
          type: string
          enum:
            - httpBasic
            - bearerToken
            - customHttpHeader
          description: Authentication type
        login:
          type: string
          description: Login for httpBasic type
        password:
          type: string
          description: Secret value (write-only, replaced by reference after storage)
        headerName:
          type: string
          description: Custom header name for customHttpHeader type
      examples:
        - type: httpBasic
          login: someuser
          password: secret
    CallbackTls:
      type: object
      required:
        - certificate
        - password
      description: Client SSL certificate authentication
      properties:
        certificate:
          type: string
          description: Base64-encoded PEM (with embedded private key) or PFX/PKCS#12 certificate
        password:
          type: string
          description: Private key password
      examples:
        - certificate: LS0tLS1CRUdJTiBF...
          password: secret
