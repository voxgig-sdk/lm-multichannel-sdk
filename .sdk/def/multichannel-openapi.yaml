      - name: _pageSize
        in: query
        required: false
        description: Page size for pagination (max 1000)
        schema:
          type: integer
          maximum: 1000
      - name: _pageIndex
        in: query
        required: false
        description: Zero-based page index
        schema:
          type: integer
      - name: _sort
        in: query
        required: false
        description: 'Sort by property paths with optional asc:/desc: prefix and ! null-coalescing'
