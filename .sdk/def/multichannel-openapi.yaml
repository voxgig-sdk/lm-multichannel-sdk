    DeliveryError:
      type: object
      required:
      - code
      description: Error details for DELIVERY_FAILED or DELIVERY_RETRIED statuses
      properties:
        code:
          $ref: '#/components/schemas/DeliveryErrorCode'
        details:
          type: string
          description: Additional information about the error
        channelError:
          type: string
          description: Channel-native error code/message
      examples:
      - code: USER_UKNOWN
        channelError: '404'
        details: Requested entity was not found.
    MessageStatus:
      type: string
      description: Message lifecycle status
      enum:
      - SCHEDULE_QUEUED
      - SCHEDULED
      - SCHEDULE_DELETED
      - SCHEDULE_DELETION_FAILED
      - QUEUED
      - SENT
      - DELIVERED
      - READ
      - DELIVERY_RETRIED
      - DELIVERY_FAILED
      x-enum-descriptions:
        SCHEDULE_QUEUED: Message queued for scheduling (triggered by scheduling, spreading, or DND deferral)
        SCHEDULED: Message was scheduled
        SCHEDULE_DELETED: Message schedule was deleted
        SCHEDULE_DELETION_FAILED: Message schedule deletion failed
        QUEUED: Message created and queued for sending
        SENT: Message sent to the channel (delivery may still fail asynchronously)
        DELIVERED: Message delivered to the end-user
        READ: Message read by the end-user (certain channels only)
        DELIVERY_RETRIED: Delivery failed, system is retrying
        DELIVERY_FAILED: Delivery fatally failed (no retries possible or max retries reached)
    DeliveryErrorCode:
      type: string
      description: Message delivery error code
      enum:
      - CLIENT_MESSAGE_INVALID
      - CLIENT_CONFIGURATION_INVALID
      - CLIENT_MESSAGE_EXPIRED
      - CLIENT_QUOTA_EXCEEDED
      - CLIENT_MESSAGE_FORBIDDEN
      - CHANNEL_REJECTED
      - CHANNEL_UNAVAILABLE
      - CHANNEL_INTERNAL_ISSUE
      - CHANNEL_OTHER_ISSUE
      - USER_UKNOWN
      - USER_BLOCKED
      - USER_UNAVAILABLE
      - INTERNAL_NOT_IMPLEMENTED
      - INTERNAL_OTHER_ISSUE
      x-enum-descriptions:
        CLIENT_MESSAGE_INVALID: Message content or parameters are invalid
        CLIENT_CONFIGURATION_INVALID: Account settings are invalid
        CLIENT_MESSAGE_EXPIRED: Delivery canceled (TTL reached)
        CLIENT_QUOTA_EXCEEDED: Account quota exceeded (e.g. schedule quota)
        CLIENT_MESSAGE_FORBIDDEN: Message not allowed due to platform restriction (e.g. DND policy)
        CHANNEL_REJECTED: Channel rejected the operation
        CHANNEL_UNAVAILABLE: Channel busy (timeout, throttling, connection issues)
        CHANNEL_INTERNAL_ISSUE: Channel internal issue
        CHANNEL_OTHER_ISSUE: Unspecified channel issue
        USER_UKNOWN: 'User is invalid or unknown (note: historical typo in code name)'
        USER_BLOCKED: User is blocked
        USER_UNAVAILABLE: User temporarily unavailable
        INTERNAL_NOT_IMPLEMENTED: Feature not yet implemented
        INTERNAL_OTHER_ISSUE: Service internal issue
    TemplateReviewStatus:
      type: string
      description: Template review lifecycle status
      enum:
      - SUBMITTING
      - SUBMITTED
      - APPROVED
      - REJECTED
      - SUSPENDED
      - DELETING
      - DELETED
      x-enum-descriptions:
        SUBMITTING: Template is about to be submitted (cannot be used yet)
        SUBMITTED: Template submitted for review or being re-evaluated (cannot be used yet)
        APPROVED: Template approved and usable with the channel
        REJECTED: Template rejected (can be modified and resubmitted)
        SUSPENDED: Template temporarily suspended by channel provider
        DELETING: Template is being deleted on channel side (cannot be used)
        DELETED: Template deleted on channel provider side (new review needed to recreate)
webhooks:
  eventCallback:
    post:
      summary: Event callback
      description: 'OCM pushes events to customer-configured callback endpoints via HTTP POST.


        ## Event types


        - `messageStatusChanged` — message lifecycle updates (QUEUED, SENT, DELIVERED, READ, DELIVERY_FAILED, etc.)

        - `userMessageReceived` — inbound user messages (text, postback, media, location, opt-in, opt-out, typing)

        - `templateReviewStatusChanged` — template review lifecycle updates (SUBMITTING, SUBMITTED, APPROVED, REJECTED, etc.)


        ## Batching


        Each callback request carries a batch of up to **100 events**.


        ## Expected response


        Clients must respond with any **2xx** status code within **30 seconds**.

        Any other response (or timeout) triggers retries.


        ## Retry policy


        On timeout, `429` or `5xx` responses, OCM retries delivery for up to **4 hours** with exponential backoff.


        ## Configuration


        The callback URL and authentication are configured via `PATCH /self/settings`.

        Setting changes apply to new messages only — keep both old and new endpoints available during transition.


        ## Traffic files alternative


        Events are also available as downloadable JSONL files via `GET /traffic/files` (retained for 30 days).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
            examples:
              sms_delivery_failed:
                summary: 'SMS: delivery failed (invalid destination)'
                value:
                  events:
                  - eventId: ems2mtzoOqeYkKAjLbvz3yQ1R
                    'on': '2020-03-06T17:12:03.737Z'
                    accountId: customer-account-id
                    messageStatusChanged:
                      messageId: msg1XAXgWzR3X27wjMdxrlJyr
                      requestId: req4fm8jz3GWtERlrWDw1s0xD
                      channelId: sms
                      userId: '99999999'
                      status: DELIVERY_FAILED
                      error:
                        code: CHANNEL_REJECTED
                        channelError: Invalid destination address
