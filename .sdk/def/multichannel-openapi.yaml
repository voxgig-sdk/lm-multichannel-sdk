      ### Card content with a Flow button and flow options

      A Meta flow can be designed with several entry screens. The `whatsapp.button.flow.screen` and
      `whatsapp.button.flow.data` options select and parameterize one of them, so two requests using
      the same Flow ID can render two different flows: the first opens the reschedule-appointment
      screen followed by the shared confirm screen, the second the cancel-appointment screen followed
      by the same confirm screen.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "messages": [
          {
            "userId": "33699999999",
            "channelId": "whatsapp",
            "content": {
              "card": {
                "title": "Reschedule your appointment",
                "text": "Pick a new date and time....",
                "subtitle": "Powered by WhatsApp Flows",
                "buttons": [
                  {
                    "caption": "Open scheduling flow",
                    "flow": {},
                    "options": {
                      "whatsapp.button.flow.id": "5556667778",
                      "whatsapp.button.flow.action": "navigate",
                      "whatsapp.button.flow.screen": "RESCHEDULE",
                      "whatsapp.button.flow.token": "my-corr-id",
                      "whatsapp.button.flow.data": "{\"booking_ref\":\"42\",\"current_slot\":\"Tue 2 Sep, 10:00\",\"slots\":[{\"id\":\"slot1\",\"title\":\"Wed 3 Sep, 09:00\",\"description\":\"Dr Aalborg\"},{\"id\":\"slot2\",\"title\":\"Wed 3 Sep, 14:30\",\"description\":\"Dr Aalborg\"}]}"
                    }
                  }
                ]
              }
            }
          }
        ]
      }
      ```

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting message</strong></p>

      <img src="https://ocm.linkmobility.solutions/public/schemas/assets/images/channels/whatsapp/session-card-flow-options-1.png" alt="WhatsApp reschedule flow card as received" width="50%" style="display:block;width:50%;height:auto;margin-bottom:14px;border:1px solid #d0d7de;border-radius:6px;box-shadow:0 1px 3px rgba(27,31,36,0.12)">

