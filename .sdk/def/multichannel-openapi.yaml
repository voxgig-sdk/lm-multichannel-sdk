                summary: SMS text template with OADC option
                value:
                  template:
                    content:
                      text: Hello {{firstName}} {{lastName}}!
                    options:
                      sms.originatingAddress: MyBrand
                    variables:
                      - name: firstName
                      - name: lastName
              rcs_card_template:
                summary: RCS card template with buttons and typed variables
                value:
                  template:
                    meta:
                      title: Soldes 2022
                    content:
                      card:
                        title: Hello there!
                        text: Hello {{firstName}} {{lastName}}!
                        buttons:
                          - caption: Tell me more
                            reply:
                              text: Tell me more
                            postback: DETAILS_{{countryCode}}
                          - caption: Call us
                            dial:
                              phoneNumber: '{{callUsPhoneNumber}}'
                          - caption: Visit us
                            openUrl:
                              url: https://{{countryCode}}.company.com
                    options:
                      rcs.card.orientation: HORIZONTAL
                    variables:
                      - name: firstName
                        examples:
                          - Georges
                      - name: lastName
                        examples:
                          - Abitbol
                      - name: countryCode
                        examples:
                          - GB
                          - FR
                          - ES
                        description: To get country-specific details or website
                      - name: callUsPhoneNumber
                        examples:
                          - '+3312456789'
                        description: Country-specific customer service number
