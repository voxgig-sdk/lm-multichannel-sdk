      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting event</strong></p>

      ```json
      {
        "eventId": "eumtNFbCvlRLawavXem1oKNp0",
        "on": "2020-03-06T11:12:28.6650547Z",
        "accountId": "client-account-id",
        "userMessageReceived": {
          "channelId": "mock",
          "userId": "33674747474",
          "content": {
            "optout": {
              "text": "STOP"
            }
          },
          "replyToMessageId": "msgSzNvoD1OyIwWDS5KM0GSJ0"
        }
      }
      ```

      <div class="ocm-space"><br></div>

      ### User clicks a Reply-typed button or suggestion

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting event</strong></p>

      ```json
      {
        "eventId": "eumAg77ExuCtUyGB0m4VVYZc0",
        "on": "2020-03-06T11:20:58.527693Z",
        "accountId": "client-account-id",
        "userMessageReceived": {
          "channelId": "mock",
          "userId": "33672727272",
          "content": {
            "postback": {
              "payload": "LOVE",
              "text": "❤️ J'aime ça"
            }
          },
          "replyToMessageId": "msgSzNvoD1OyIwWDS5KM0GSJ0"
        }
      }
      ```

      <div class="ocm-space"><br></div>

      ### User clicks a Share Location button and sends their location

      Two events: the postback for the click, then the shared location.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting event</strong></p>

      ```json
