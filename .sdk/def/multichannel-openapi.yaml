      ### Card content with a Copy Code button (authentication category)

      This template uses the authentication category with a Spanish language option, a 2-minute
      message TTL and code expiration, and the security recommendation enabled
      (*"Por tu seguridad, no lo compartas."*). The main text and footer text are set by WhatsApp
      and cannot be customized for authentication templates — only the template language option
      affects their localization.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "template":{
          "content":{
            "card":{
              "text": "{{code}}",
              "buttons":[
                {
                  "caption": "Copiar código",
                  "copyCode": { "value": "{{code}}" }
                }
              ]
            }
          },
          "variables":[
            { "name": "code", "examples": [ "123456" ] }
          ],
          "options": {
            "whatsapp.template.category": "AUTHENTICATION",
            "whatsapp.template.language": "es",
            "whatsapp.template.messageSendTtlSeconds": "120",
            "whatsapp.template.authentication.codeExpirationMinutes": "2",
            "whatsapp.template.authentication.addSecurityRecommendation": "true"
          }
        }
      }
      ```

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Resulting message</strong></p>

      <img src="https://ocm.linkmobility.solutions/public/schemas/assets/images/channels/whatsapp/tpl-card-copycode-auth.png" alt="WhatsApp authentication template with a copy code button" width="50%" style="display:block;width:50%;height:auto;margin-bottom:14px;border:1px solid #d0d7de;border-radius:6px;box-shadow:0 1px 3px rgba(27,31,36,0.12)">

