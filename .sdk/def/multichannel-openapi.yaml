  /messages/{messageId}/schedule:
    get:
      tags:
        - Messages
      operationId: getMessageSchedule
      summary: Get message schedule information
      description: Retrieves basic information about a message schedule, if it exists.
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Schedule found
          content:
            application/json:
              schema:
                type: object
                required:
                  - schedule
                properties:
                  schedule:
                    $ref: '#/components/schemas/MessageSchedule'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Messages
      operationId: deleteMessageSchedule
      summary: Delete a message schedule
      description: |
        Deletes a message schedule synchronously, canceling sending at the scheduled time.
        Consumes the same API rate limits as message sending. Not optimized for bulk deletion.
        For bulk deletion, use DELETE /schedules.
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '204':
          description: Schedule deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /schedules:count:
    get:
      tags:
        - Schedules
      operationId: getScheduleCount
      summary: Get count of active schedules
      description: Gets the count of active message schedules belonging to the account, with optional filters.
      parameters:
        - name: campaignId
          in: query
          required: false
          description: Schedule grouping identifier
          schema:
            type: string
        - name: between
          in: query
          required: false
          description: Time range as pair of ISO 8601 timestamps separated by comma (inclusive)
          schema:
            type: string
          examples:
            default:
              value: 2026-02-01T10:00,2026-02-16T20:00
        - name: timeZone
          in: query
          required: false
          description: IANA TZ for interpreting the between parameter
          schema:
            type: string
          examples:
            default:
              value: Europe/Zurich
      responses:
        '200':
          description: Count returned
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
                    description: Number of active schedules
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /schedules:
    delete:
      tags:
        - Schedules
      operationId: bulkDeleteSchedules
      summary: Bulk delete active schedules
      description: |
        Asynchronously deletes active message schedules belonging to the account, with optional filters.
        Optimized for bulk deletion. Returns 409 Conflict if another bulk deletion is already in progress.
      parameters:
        - name: campaignId
          in: query
          required: false
          description: Schedule grouping identifier
          schema:
            type: string
        - name: between
          in: query
          required: false
          description: Time range as pair of ISO 8601 timestamps separated by comma (inclusive)
          schema:
            type: string
        - name: timeZone
          in: query
          required: false
          description: IANA TZ for interpreting the between parameter
          schema:
            type: string
      responses:
        '202':
          description: Deletion initiated
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
                    description: Number of schedules at the moment deletion was requested
        '409':
          description: Another bulk deletion is already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
