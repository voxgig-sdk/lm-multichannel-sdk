      <div class="ocm-warning" style="margin:0 0 14px;padding:10px 14px;border-left:4px solid #d4a72c;border-radius:6px;background:#fff8c5;color:#24292f">⚠️ <strong>Template API features are enabled on demand by LINK Mobility support.</strong></div>

