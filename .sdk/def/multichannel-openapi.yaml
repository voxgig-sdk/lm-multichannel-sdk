        "accountId": "customer-account-id",
        "userMessageReceived": {
          "channelId": "sms",
          "userId": "33699999999",
          "content": {
            "optout": {
              "text": "STOP"
            }
          },
          "replyToMessageId": "msgSzNvoD1OyIwWDS5KM0GSJ0"
        }
