webhooks:
  Callbacks:
    post:
      tags:
        - Callbacks
      operationId: eventCallback
      summary: Event callback requests
      security: []
      description: |-
        MyLINK Multichannel API pushes batched events to customer-configured callback endpoints via HTTP POST.

        ### Event types

        - `messageStatusChanged` — message lifecycle updates (`QUEUED`, `SENT`, `DELIVERED`, `READ`, `DELIVERY_FAILED`, etc.). See [Message Statuses](#tag/Message-Statuses).
        - `userMessageReceived` — inbound user messages (text, postback, media, location, opt-in, opt-out, typing)
        - `templateReviewStatusChanged` — template review lifecycle updates (`SUBMITTING`, `SUBMITTED`, `APPROVED`, `REJECTED`, etc.). See [Template Review Statuses](#tag/Template-Review-Statuses).

        ### Batching

        Each callback request carries a batch of up to **100 events**.

        ### Expected response

        Clients must respond with any **2xx** status code within **30 seconds**.
        Any other response (or timeout) triggers retries.

        ### Retry policy

        MyLINK Multichannel API retries event delivery on the following conditions:

        - Timeouts — no response from the callback endpoint within **30 seconds**
        - Transient network issues
        - HTTP status codes `429` and `5xx`

        Retries are performed over a maximum period of **4 hours**, following two policies:

        1. Within the first **15 seconds** after the initial failure, up to **10** additional attempts are performed, with an increasing delay between each retry (exponential backoff).
        2. After that, delivery is retried approximately every **1 to 2 minutes**.

        As attempts accumulate against a failing callback endpoint, the event batches (the `events` property of the callback request) grow over time, up to **100 events** in a single request.

        Duplicate events can be received — for example, when an event was processed but the response took longer than 30 seconds. The `eventId` property should be used to deduplicate events.

        ### Configuration

        The callback URL and authentication are configured via `PATCH /self/settings`.
        Setting changes apply to new messages only — keep both old and new endpoints available during transition.

        ### Callback authentication

        Callback requests can be authenticated by configuring `settings.callback` via the Self Admin API (`PATCH /self/settings`). Three independent mechanisms are available and may be combined:

        - **Request authentication** (`callback.auth`) — a credential header on every request: HTTP Basic (`httpBasic`), a static bearer token (`bearerToken`), or a custom header of any name (`customHttpHeader`, e.g. `x-api-key`). Secret values are write-only.
        - **Client TLS certificate** (`callback.tls`) — MyLINK Multichannel API presents a client certificate for mutual TLS, supplied as a base64-encoded PEM with the private key embedded, or a PFX/PKCS#12 bundle.
        - **Request signing** (`callback.signatureEnabled`) — the API signs every request with its platform key, establishing itself as the origin of the batch. See **Signature verification** below.

        ### Signature verification

        When `signatureEnabled` is set on the callback settings (via `PATCH /self/settings`), MyLINK Multichannel API signs every callback request with its platform Ed25519 key and adds three headers:
        - `X-OCM-Timestamp` — Unix epoch **seconds** captured when the batch was signed
        - `X-OCM-Signature` — standard base64 of the raw Ed25519 signature
        - `X-OCM-Key-Id` — the signing key id (`kid`); use it to select the matching key from the JWKS
        The signature covers the UTF-8 bytes of **`{X-OCM-Timestamp}.{body}`**, where `body` is the uncompressed JSON request body. When compression is enabled the body is gzipped **after** signing, so verifiers must decompress first, then verify over the decompressed bytes.
        To verify: fetch the public JWKS at `/.well-known/ocm-cb/jwks.json`, select the key whose `kid` equals `X-OCM-Key-Id`, and check the EdDSA signature. Optionally reject requests whose `X-OCM-Timestamp` is older than ~5 minutes to guard against replay.
        The same timestamp and signature are reused across the API's short in-process retries, so `X-OCM-Signature` also serves as a stable idempotency key; a later retry produces a fresh timestamp and signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
