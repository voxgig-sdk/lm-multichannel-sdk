      ### Card content with a Flow button (marketing category)

      The flow itself must be created in the Meta Business Portal; the template only carries a
      reference to its ID, through the dedicated flow option. This template sets
      `whatsapp.button.flow.action` to `navigate`, passes a correlation ID through
      `whatsapp.button.flow.token`, and uses the marketing category.

      <p class="ocm-legend" style="margin:0 0 4px;font-size:0.8em;font-weight:700;color:#6a737d;letter-spacing:0.02em"><strong>Request</strong></p>

      ```json
      {
        "template": {
          "content": {
            "card": {
              "text": "Hello dear {{firstName}}, are you ready to give your feedback?",
              "subtitle": "Takes 2 minutes",
              "buttons": [
                {
                  "caption": "Takes the survey",
                  "flow": {},
                  "options": {
                    "whatsapp.button.flow.id": "1705955467..",
                    "whatsapp.button.flow.action": "navigate",
                    "whatsapp.button.flow.token": "{{corrId}}"
                  }
                }
              ]
            }
          },
          "variables": [
            {
              "name": "firstName",
              "examples": [
                "Georges"
              ]
            },
            {
              "name": "corrId",
              "examples": [
                "my-correlation-id"
              ]
            }
          ],
          "options": {
            "whatsapp.template.category": "MARKETING"
          }
        }
      }
      ```

